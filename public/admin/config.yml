backend:
  name: github
  repo: cezi/riverside-app
  branch: main

media_libraries:
  cloudinary:
    config:
      cloud_name: "riverside"
      api_key: "156475955429289"
      default_transformations:
        - - quality: auto
            fetch_format: auto
    output_filename_only: false
    use_transformations: false

media_folder: /public/uploads
public_folder: /uploads
#locale: pl

collections:

  - name: posts
    label: Posty
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title,     label: Tytuł,        widget: string }
      - { name: author, label: Autor, widget: string, default: MR Glass Project, required: false }
      - { name: date,      label: Data,          widget: datetime, format: "YYYY-MM-DD" }
      - { name: excerpt,   label: Zajawka,       widget: text }
      - name: cover
        label: Zdjęcie główne
        widget: image
      - { name: published, label: Opublikowany,  widget: boolean, default: false }
      - { name: body,      label: Treść,         widget: markdown }

  - name: gallery
    label: Realizacje
    label_singular: Realizacja
    folder: src/content/gallery
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Tytuł, widget: string }
      - name: category
        label: Kategoria
        widget: select
        options:
          - { label: "Lokal", value: Lokal }
          - { label: "Wnętrza", value: Wnetrza }
          - { label: "Tank", value: Tank }
          - { label: "Chef", value: Chef }
          - { label: "Dania", value: Dania }
      - name: media
        label: Zdjęcia / wideo
        widget: list
        label_singular: Plik
        thumbnail: file
        collapsed: true
        fields:
          - name: file
            label: Zdjęcie lub wideo
            hint: "Z biblioteki Cloudinary można wybrać zarówno zdjęcie, jak i plik wideo (mp4 itp.)."
            widget: file
            required: true
          - name: alt
            label: Tekst ALT / opis
            widget: string
            required: false

      - { name: order, label: Kolejność, widget: number, default: 0, required: false, value_type: int }
      - { name: published,   label: Opublikowana,     widget: boolean, default: true }

  - name: menu
    label: Menu
    label_singular: Danie
    folder: src/content/menu
    create: true
    slug: "{{slug}}"
    fields:
      - { name: category, label: Kategoria, widget: string, hint: "Nazwa kategorii, np. Przekąski. Musi być identycznie wpisana przy wszystkich daniach tej samej kategorii." }
      - { name: name, label: Nazwa dania, widget: string }
      - { name: description, label: Składniki / opis, widget: text, required: false }
      - { name: price, label: Cena, widget: string, hint: "np. 48,90 zł lub 21,90 / 36,90 zł" }
      - { name: weight, label: Gramatura, widget: string, required: false, hint: "np. 200/450 g" }
      - name: tags
        label: Etykiety
        widget: select
        multiple: true
        required: false
        options: [Pikantne, Wegetariańskie, Polecane]
      - name: image
        label: Zdjęcie dania
        widget: file
        required: false
      - { name: order, label: Kolejność, widget: number, default: 0, required: false, value_type: int, hint: "Ustala kolejność dania w kategorii ORAZ kolejność samych kategorii na stronie (decyduje najniższy numer w danej kategorii)." }
      - { name: published, label: Opublikowane, widget: boolean, default: true }

  - name: testimonials
    label: Opinie
    label_singular: Opinia
    folder: src/content/testimonials
    create: true
    slug: "{{slug}}"
    fields:
      - { name: name,    label: Imię i nazwisko, widget: string }
      - { name: content, label: Treść opinii,    widget: text }
      - { name: rating,  label: Ocena (1-5),     widget: number, min: 1, max: 5, default: 5 }
      - { name: source,  label: Źródło,          widget: string, default: Google, required: false }

  - name: faq
    label: FAQ
    label_singular: Pytanie FAQ
    folder: src/content/faq
    create: true
    slug: "{{slug}}"
    fields:
      - { name: question, label: Pytanie,   widget: string }
      - { name: answer,   label: Odpowiedź, widget: text }
      - { name: order,    label: Kolejność, widget: number, default: 0 }

  - name: pages
    label: Strony prawne
    files:
      - name: privacy
        label: Polityka prywatności
        file: src/content/pages/privacy.md
        fields:
          - { name: title,     label: Tytuł,             widget: string }
          - { name: updatedAt, label: Data aktualizacji,  widget: datetime, required: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { name: body,      label: Treść,              widget: markdown }
      - name: terms
        label: Regulaminy
        file: src/content/pages/terms.md
        fields:
          - { name: title,     label: Tytuł,             widget: string }
          - { name: updatedAt, label: Data aktualizacji,  widget: datetime, required: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { name: body,      label: Treść,              widget: markdown }
      - name: loyalty-priv
        label: Program lojalnościowy — klienci indywidualni
        file: src/content/pages/loyalty-priv.md
        fields:
          - { name: title,     label: Tytuł,             widget: string }
          - { name: updatedAt, label: Data aktualizacji,  widget: datetime, required: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { name: body,      label: Treść,              widget: markdown }
      - name: loyalty-biz
        label: Program lojalnościowy — firmy
        file: src/content/pages/loyalty-biz.md
        fields:
          - { name: title,     label: Tytuł,             widget: string }
          - { name: updatedAt, label: Data aktualizacji,  widget: datetime, required: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { name: body,      label: Treść,              widget: markdown }
      - name: terms-priv
        label: Regulamin programu lojalnościowego — klienci indywidualni
        file: src/content/pages/terms-priv.md
        fields:
          - { name: title,     label: Tytuł,             widget: string }
          - { name: updatedAt, label: Data aktualizacji,  widget: datetime, required: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { name: body,      label: Treść,              widget: markdown }
      - name: terms-biz
        label: Regulamin programu lojalnościowego — firmy
        file: src/content/pages/terms-biz.md
        fields:
          - { name: title,     label: Tytuł,             widget: string }
          - { name: updatedAt, label: Data aktualizacji,  widget: datetime, required: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { name: body,      label: Treść,              widget: markdown }

  - name: settings
    label: Ustawienia
    files:
      - name: site
        label: Dane strony i social media
        file: src/data/settings.json
        fields:
          - { name: phone,   label: Telefon, widget: string }
          - { name: email,   label: Email,   widget: string }
          - { name: address, label: Adres,   widget: string }
          - { name: hours,   label: Godziny, widget: string }
          - { name: reservation_url, label: "Link do rezerwacji online (zjedz.my)", widget: string }
          - name: social
            label: Social media
            widget: object
            fields:
              - { name: facebook,   label: Facebook URL,    widget: string, required: false }
              - { name: instagram,  label: Instagram URL,   widget: string, required: false }
              - { name: tiktok,     label: TikTok URL,      widget: string, required: false }
              - { name: googlemaps, label: Google Maps URL, widget: string, required: false }